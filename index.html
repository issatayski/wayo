<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WayO — Кабинет автовокзала</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #ffffff;
  --bg-secondary: #F8F9FA;
  --bg-tertiary: #F1F3F5;
  --text-primary: #0F1623;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --border-tertiary: rgba(0,0,0,0.08);
  --border-secondary: rgba(0,0,0,0.14);
  --accent: #1A56DB;
  --accent-light: #EFF4FF;
  --accent-hover: #1648C0;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font: -apple-system, 'Inter', 'Segoe UI', sans-serif;
}

html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); }

/* ── Layout ── */
.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sb {
  width: 220px;
  background: var(--bg-primary);
  border-right: 0.5px solid var(--border-tertiary);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
}

.sb-top {
  padding: 18px 16px 14px;
  border-bottom: 0.5px solid var(--border-tertiary);
}
.sb-logo { display: flex; align-items: center; gap: 9px; }
.sb-logo-icon {
  width: 30px; height: 30px;
  border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sb-logo-icon svg { width: 17px; height: 17px; }
.sb-logo-name { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }
.sb-station { font-size: 11px; color: var(--text-secondary); margin-top: 4px; padding-left: 39px; }

.sb-nav { padding: 8px; flex: 1; overflow-y: auto; }
.sb-section {
  font-size: 10px; font-weight: 600;
  color: var(--text-tertiary);
  padding: 14px 8px 5px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}
.sb-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 9px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 1px;
  user-select: none;
  transition: background 0.1s, color 0.1s;
  position: relative;
}
.sb-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
.sb-item.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 500;
}
.sb-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.65; }
.sb-item.active svg { opacity: 1; }
.sb-item:hover svg { opacity: 0.9; }
.sb-badge {
  margin-left: auto;
  font-size: 10px; font-weight: 500;
  padding: 1px 6px;
  border-radius: 20px;
}
.sb-badge.red { background: #FEE2E2; color: #B91C1C; }
.sb-badge.blue { background: #DBEAFE; color: #1D4ED8; }

.sb-user {
  padding: 12px 14px;
  border-top: 0.5px solid var(--border-tertiary);
  display: flex; align-items: center; gap: 9px;
}
.sb-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  color: var(--accent);
  flex-shrink: 0;
}
.sb-uname { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.sb-urole { font-size: 11px; color: var(--text-secondary); }

/* ── Main area ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Top bar ── */
.topbar {
  height: 52px;
  padding: 0 22px;
  background: var(--bg-primary);
  border-bottom: 0.5px solid var(--border-tertiary);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.tb-left { display: flex; align-items: center; gap: 8px; }
.tb-title { font-size: 15px; font-weight: 500; color: var(--text-primary); }
.tb-sep { width: 1px; height: 14px; background: var(--border-tertiary); }
.tb-live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22C55E; }
.tb-live { font-size: 11px; color: #16A34A; font-weight: 500; }
.tb-right { display: flex; align-items: center; gap: 7px; }

/* ── Buttons ── */
.btn {
  font-size: 12px;
  padding: 6px 13px;
  border-radius: var(--radius-md);
  border: 0.5px solid var(--border-secondary);
  background: var(--bg-primary);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background 0.1s;
  font-family: var(--font);
}
.btn:hover { background: var(--bg-secondary); }
.btn svg { width: 13px; height: 13px; opacity: 0.6; }
.btn-primary {
  background: var(--accent); color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary svg { opacity: 1; }
.btn-danger { color: #B91C1C; border-color: #FECACA; }
.btn-danger:hover { background: #FEF2F2; }

/* ── Page content ── */
.page-wrap { flex: 1; overflow-y: auto; padding: 18px 22px; }

/* ── Screen switching ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── Shared card ── */
.card {
  background: var(--bg-primary);
  border: 0.5px solid var(--border-tertiary);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
}
.card-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.card-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.card-link { font-size: 11px; color: var(--accent); cursor: pointer; }

/* ── Badges ── */
.badge {
  font-size: 10px; font-weight: 500;
  padding: 2px 8px;
  border-radius: 20px;
  display: inline-block;
}
.b-green { background: #DCFCE7; color: #166534; }
.b-yellow { background: #FEF9C3; color: #854D0E; }
.b-red { background: #FEE2E2; color: #991B1B; }
.b-blue { background: #DBEAFE; color: #1E40AF; }
.b-gray { background: #F3F4F6; color: #374151; }
.b-purple { background: #EDE9FE; color: #5B21B6; }

/* ── Metric cards ── */
.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 14px; }
.mc {
  background: var(--bg-primary);
  border: 0.5px solid var(--border-tertiary);
  border-radius: var(--radius-md);
  padding: 13px 15px;
  position: relative; overflow: hidden;
}
.mc-accent {
  position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.mc-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
.mc-val { font-size: 22px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.5px; }
.mc-footer { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.mc-delta { font-size: 11px; }
.up { color: #16A34A; }
.down { color: #DC2626; }
.neutral { color: var(--text-secondary); }

/* ── Tables ── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px; font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border-bottom: 0.5px solid var(--border-tertiary);
}
tbody td {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--border-tertiary);
  color: var(--text-primary);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg-secondary); }
.td-name { font-weight: 500; }
.td-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

/* ── Search / filters bar ── */
.filters {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
}
.search-wrap { position: relative; flex: 1; max-width: 280px; }
.search-wrap svg {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; color: var(--text-tertiary);
}
.search-input {
  width: 100%; padding: 6px 10px 6px 30px;
  border: 0.5px solid var(--border-secondary);
  border-radius: var(--radius-md);
  font-size: 12px; font-family: var(--font);
  background: var(--bg-secondary);
  color: var(--text-primary);
  outline: none;
}
.search-input:focus { border-color: var(--accent); background: var(--bg-primary); }
select.filter-select {
  padding: 6px 10px;
  border: 0.5px solid var(--border-secondary);
  border-radius: var(--radius-md);
  font-size: 12px; font-family: var(--font);
  background: var(--bg-secondary);
  color: var(--text-primary);
  outline: none; cursor: pointer;
}

/* ── Fill bar ── */
.fill-wrap { display: flex; align-items: center; gap: 6px; }
.fill-track { width: 56px; height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; }
.fill-bar { height: 4px; border-radius: 2px; }
.fill-txt { font-size: 11px; color: var(--text-secondary); }

/* ── Modal backdrop ── */
.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 100;
  align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  border: 0.5px solid var(--border-tertiary);
  width: 460px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 22px 24px;
}
.modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.modal-title { font-size: 15px; font-weight: 500; }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: none; background: var(--bg-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.modal-close:hover { background: var(--bg-tertiary); }

/* ── Form elements ── */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-primary); margin-bottom: 5px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 7px 10px;
  border: 0.5px solid var(--border-secondary);
  border-radius: var(--radius-md);
  font-size: 12px; font-family: var(--font);
  color: var(--text-primary);
  background: var(--bg-primary);
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(26,86,219,0.08);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--text-primary);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-size: 13px;
  display: flex; align-items: center; gap: 8px;
  z-index: 200;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-icon { width: 18px; height: 18px; border-radius: 50%; background: #22C55E; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-secondary); border-radius: 3px; }
</style>
</head>

      </div>
      <div class="sb-item" data-screen="cashier">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 7h14" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="9.5" width="3" height="1.5" rx="0.5" fill="currentColor"/><rect x="7" y="9.5" width="3" height="1.5" rx="0.5" fill="currentColor"/></svg>

      </div>
      <div class="sb-item" data-screen="reports">

  <!-- ══ MAIN ══ -->
  <div class="main">

        <span class="tb-live">Онлайн</span>

      </div>

      <!-- ── DASHBOARD ── -->

      <!-- u041au0430u0441u0441u0430 -->
      <div class="screen" id="screen-cashier"></div>

      <!-- ── REPORTS ── -->

      <div class="screen" id="screen-sitcenter"></div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-icon">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <span id="toast-msg">Готово</span>
</div>

<script>
// ── Router ────────────────────────────────────────────────────
const titles = {
  dashboard: 'Дашборд', buses: 'Автобусы', trips: 'Рейсы',
  predreysovoy: 'Предрейсовый контроль',
  sales: 'Продажи', cashier: 'Касса', reports: 'Отчётность', sitcenter: 'Карта рейсов — Live', staff: 'Сотрудники', settings: 'Настройки'
};

function navigate(id) {
  document.querySelectorAll('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.screen === id));
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === 'screen-' + id));
  document.getElementById('page-title').textContent = titles[id] || id;
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = topbarActions[id] ? topbarActions[id]() : '';
  if (window['render_' + id]) window['render_' + id]();
}

document.querySelectorAll('.sb-item[data-screen]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.screen));
});

// ── Toast ──────────────────────────────────────────────────────
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── Topbar actions per screen ──────────────────────────────────
const topbarActions = {
  dashboard: () => `
    <button class="btn" onclick="showToast('Отчёт экспортирован')">
      <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v7M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Экспорт
    </button>
    <button class="btn btn-primary" onclick="navigate('trips')">
      <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
      Создать рейс
    </button>`,
  buses: () => `
    <button class="btn btn-primary" onclick="openModal('modal-add-bus')">

// ── Modal helpers ──────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-backdrop')) {
    e.target.classList.remove('open');
  }
});

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  navigate('dashboard');
});
